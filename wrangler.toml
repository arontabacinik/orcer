# Cloudflare Workers — o Orcer é um site estático e é assim que ele vai para o ar.
#
#   npm run deploy      ->  build + `wrangler deploy`
#
# Não há `main`: o Orcer não tem servidor. O Worker só entrega os arquivos de dist/, e os cabeçalhos de
# public/_headers viajam junto. Nenhum PDF passa por aqui — o motor roda no navegador de quem usa, e a
# política de segurança do conteúdo (CSP) faz disso uma regra do navegador, não uma promessa nossa.
name = "orcer"
compatibility_date = "2026-09-29"

[assets]
directory = "./dist"
