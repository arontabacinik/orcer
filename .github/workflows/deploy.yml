# Publica o Orcer na Cloudflare (Workers, Static Assets) a cada push no main.
#
# Precisa de dois segredos no repositório (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token com a permissão "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID  o Account ID da conta Cloudflare
# Sem eles o job falha no passo do deploy e nada é publicado.
#
# O Orcer é estático: sobe o dist/ e pronto. Nenhum PDF passa por servidor nenhum — o motor roda no
# navegador de quem usa, e os cabeçalhos de public/_headers fazem disso uma regra do navegador.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # o build já roda `tsc --noEmit` antes do vite: não publica o que não compila
      - run: npm run build

      # a conferência rápida (exemplo + sintéticas + lote) — segundos, e segura
      # um deploy que quebrou a contagem
      - run: npm test

      # e a TELA, num navegador de verdade, servindo o dist/ com os cabeçalhos de produção: o fluxo
      # inteiro, o CSV, o teclado, o celular e a CSP. Não adianta o motor estar certo se a página não abre.
      - run: npx playwright install --with-deps chromium
      - run: npm run tela

      - name: Publicar na Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.143.0 deploy
