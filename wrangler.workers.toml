# Cloudflare Workers (Static Assets) — o outro caminho para a mesma pasta.
#   npm run deploy:workers   ->  wrangler deploy -c wrangler.workers.toml
#
# O Orcer não tem servidor: não há `main`, só a pasta de arquivos. O Worker serve o dist/ e nada mais —
# nenhum PDF passa por ele, o motor roda no navegador de quem usa.
# O caminho de Pages continua em wrangler.toml (`npm run deploy`). Escolha um: dois deploys, dois endereços.
name = "orcer"
compatibility_date = "2026-09-29"

[assets]
directory = "./dist"
